
name: Build APK Tabel Siswa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name tabel_siswa .

      - name: Set compatible Gradle version
        shell: bash
        run: |
          sed -i -E \
            's/gradle-[0-9.]+-(bin|all)\.zip/gradle-8.14.3-\1.zip/' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set compatible Android plugins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          if not p.exists():
              p = Path("android/settings.gradle")

          if not p.exists():
              raise SystemExit("ERROR: File settings.gradle tidak ditemukan")

          s = p.read_text()

          replacements = [
              (
                  r'(id\s*\(?\s*["\']com\.android\.application["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>8.11.1\2',
              ),
              (
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>2.2.20\2',
              ),
              (
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.plugin\.android["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>2.2.20\2',
              ),
          ]

          for pattern, replacement in replacements:
              s = re.sub(pattern, replacement, s)

          if "com.android.application" not in s:
              raise SystemExit("ERROR: Plugin Android tidak ditemukan")

          if not re.search(r'com\.android\.application.*version\s+["\']8\.11\.1["\']', s):
              raise SystemExit(
                  "ERROR: Versi AGP belum terganti. Periksa settings.gradle secara manual."
              )

          p.write_text(s)
          print(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter analyze --no-pub

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-tabel-siswa
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
